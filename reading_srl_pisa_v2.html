<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Четивна грамотност и саморегулация — 7. клас</title>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,400;0,600;0,700;1,400&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #FAFAF7;
  --surface: #FFFFFF;
  --surface-alt: #F4F1EC;
  --text: #1A1A1A;
  --text-sec: #555;
  --text-muted: #888;
  --accent: #2D6A4F;
  --accent-light: #D8F3DC;
  --accent-hover: #1B4332;
  --border: #DDD9D0;
  --border-light: #EAE7E0;
  --srl-bg: #FFFCF0;
  --srl-border: #E8C547;
  --srl-accent: #A67C00;
  --demo-bg: #F0F4FF;
  --demo-border: #7B9ED9;
  --demo-accent: #2C5282;
  --error: #C1292E;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
  --shadow-md: 0 4px 14px rgba(0,0,0,0.07);
  --radius: 8px;
  --radius-lg: 12px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'DM Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.65;
}

/* ---- PROGRESS BAR ---- */
.progress-bar {
  position: sticky;
  top: 0;
  z-index: 200;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 10px 20px;
}
.progress-inner {
  max-width: 820px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  gap: 14px;
}
.progress-track {
  flex: 1;
  height: 5px;
  background: var(--surface-alt);
  border-radius: 3px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: var(--accent);
  border-radius: 3px;
  transition: width 0.4s ease;
}
.progress-label {
  font-size: 0.78rem;
  color: var(--text-muted);
  white-space: nowrap;
  font-weight: 500;
  min-width: 120px;
  text-align: right;
}

/* ---- CONTAINER ---- */
.container {
  max-width: 820px;
  margin: 0 auto;
  padding: 20px 20px 80px;
}

/* ---- SECTIONS ---- */
.section { display: none; animation: fadeIn 0.25s ease; }
.section.active { display: block; }
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ---- HEADER ---- */
.header {
  text-align: center;
  padding: 36px 0 28px;
  border-bottom: 2px solid var(--accent);
  margin-bottom: 28px;
}
.header h1 {
  font-family: 'Source Serif 4', serif;
  font-size: 1.65rem;
  font-weight: 700;
  color: var(--accent-hover);
  margin-bottom: 6px;
}
.header .sub { font-size: 0.88rem; color: var(--text-sec); }

/* ---- BLOCK HEADER (for each major block) ---- */
.block-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 20px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--border);
}
.block-header .block-icon {
  width: 36px; height: 36px;
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.1rem;
  flex-shrink: 0;
}
.block-header .block-icon.reading { background: var(--accent-light); }
.block-header .block-icon.srl { background: #FFF3D6; }
.block-header .block-icon.demo { background: #E0EAFF; }
.block-header .block-title {
  font-family: 'Source Serif 4', serif;
  font-size: 1.15rem;
  font-weight: 700;
  color: var(--accent-hover);
}
.block-header .block-sub {
  font-size: 0.8rem;
  color: var(--text-muted);
}

/* ---- PASSAGE ---- */
.passage-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 24px 28px;
  margin-bottom: 20px;
  box-shadow: var(--shadow-sm);
}
.passage-card .set-label {
  font-size: 0.72rem;
  text-transform: uppercase;
  letter-spacing: 0.6px;
  color: var(--accent);
  font-weight: 700;
  margin-bottom: 4px;
}
.passage-card .set-title {
  font-family: 'Source Serif 4', serif;
  font-size: 1.1rem;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 2px;
}
.passage-card .set-meta {
  font-size: 0.78rem;
  color: var(--text-muted);
  margin-bottom: 14px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--border-light);
}
.passage-card p { margin-bottom: 10px; font-size: 0.92rem; }
.passage-card p:last-of-type { margin-bottom: 0; }
.passage-card .source-note {
  font-size: 0.78rem;
  color: var(--text-muted);
  font-style: italic;
  margin-top: 14px;
}
.passage-card table {
  width: 100%;
  border-collapse: collapse;
  margin: 14px 0;
  font-size: 0.82rem;
}
.passage-card th {
  background: var(--surface-alt);
  padding: 7px 8px;
  text-align: left;
  font-weight: 600;
  border: 1px solid var(--border);
  font-size: 0.78rem;
}
.passage-card td {
  padding: 6px 8px;
  border: 1px solid var(--border);
}

/* ---- QUESTION CARD ---- */
.question-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 18px 22px;
  margin-bottom: 14px;
  box-shadow: var(--shadow-sm);
}
.q-number {
  font-size: 0.7rem;
  font-weight: 600;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.4px;
  margin-bottom: 5px;
}
.q-text {
  font-size: 0.92rem;
  font-weight: 500;
  margin-bottom: 12px;
  line-height: 1.45;
}

/* Options */
.options-list { display: flex; flex-direction: column; gap: 6px; }
.option-item {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 9px 14px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  cursor: pointer;
  transition: all 0.12s ease;
  font-size: 0.88rem;
}
.option-item:hover { background: var(--surface-alt); border-color: var(--accent); }
.option-item.selected { background: var(--accent-light); border-color: var(--accent); }
.option-item input[type="radio"] { margin-top: 3px; accent-color: var(--accent); flex-shrink: 0; }

/* Free text */
.free-text {
  width: 100%;
  min-height: 72px;
  padding: 10px 12px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  font-family: 'DM Sans', sans-serif;
  font-size: 0.88rem;
  resize: vertical;
  transition: border-color 0.2s;
}
.free-text:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-light); }

/* Ordering */
.ordering-item {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 14px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  margin-bottom: 5px;
}
.ordering-item select {
  width: 48px; padding: 4px;
  border: 1px solid var(--border); border-radius: 4px;
  font-family: 'DM Sans', sans-serif; font-size: 0.85rem;
  text-align: center;
}

/* Matching */
.matching-row {
  display: flex; align-items: center; gap: 12px;
  padding: 9px 14px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  margin-bottom: 5px;
}
.matching-row .match-label { flex: 1; font-size: 0.86rem; }
.matching-row select {
  width: 52px; padding: 5px;
  border: 1px solid var(--border); border-radius: 4px;
  font-family: 'DM Sans', sans-serif; font-size: 0.85rem;
  text-align: center;
}

/* ---- LIKERT (SRL) ---- */
.srl-intro {
  background: var(--srl-bg);
  border: 1px solid var(--srl-border);
  border-left: 4px solid var(--srl-accent);
  border-radius: var(--radius);
  padding: 16px 20px;
  margin-bottom: 20px;
  font-size: 0.88rem;
}
.srl-intro strong { color: var(--srl-accent); }

.srl-construct-label {
  font-size: 0.75rem;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  font-weight: 700;
  color: var(--srl-accent);
  margin: 24px 0 10px;
  padding-bottom: 6px;
  border-bottom: 1px dashed var(--srl-border);
}
.srl-construct-label:first-of-type { margin-top: 0; }

.likert-card {
  background: #FFFEF8;
  border: 1px solid var(--srl-border);
  border-radius: var(--radius);
  padding: 14px 18px;
  margin-bottom: 10px;
}
.likert-text { font-size: 0.88rem; margin-bottom: 8px; line-height: 1.4; }
.likert-scale { display: flex; gap: 0; }
.likert-option {
  flex: 1;
  text-align: center;
  padding: 7px 2px;
  border: 1px solid var(--border);
  cursor: pointer;
  font-size: 0.72rem;
  transition: all 0.12s ease;
  background: var(--surface);
  line-height: 1.2;
}
.likert-option:first-child { border-radius: var(--radius) 0 0 var(--radius); }
.likert-option:last-child { border-radius: 0 var(--radius) var(--radius) 0; }
.likert-option:hover { background: var(--surface-alt); }
.likert-option.selected {
  background: var(--srl-accent);
  color: white;
  border-color: var(--srl-accent);
  font-weight: 600;
}

/* ---- DEMO QUESTIONS ---- */
.demo-card {
  background: var(--demo-bg);
  border: 1px solid var(--demo-border);
  border-radius: var(--radius);
  padding: 16px 20px;
  margin-bottom: 12px;
}
.demo-card .demo-label {
  font-size: 0.85rem;
  font-weight: 500;
  margin-bottom: 8px;
}
.demo-card select, .demo-card input[type="text"] {
  width: 100%;
  padding: 8px 12px;
  border: 1px solid var(--demo-border);
  border-radius: var(--radius);
  font-family: 'DM Sans', sans-serif;
  font-size: 0.88rem;
  background: white;
}
.demo-options { display: flex; flex-direction: column; gap: 5px; }
.demo-option {
  display: flex; align-items: center; gap: 8px;
  padding: 7px 12px;
  border: 1px solid var(--demo-border);
  border-radius: var(--radius);
  cursor: pointer;
  font-size: 0.85rem;
  background: white;
  transition: all 0.12s;
}
.demo-option:hover { background: #E8F0FE; }
.demo-option.selected { background: #C5D9F2; border-color: var(--demo-accent); }
.demo-option input { accent-color: var(--demo-accent); }

/* ---- NAVIGATION ---- */
.nav-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 28px;
  padding-top: 16px;
  border-top: 1px solid var(--border);
}
.btn {
  padding: 9px 22px;
  border: none;
  border-radius: var(--radius);
  font-family: 'DM Sans', sans-serif;
  font-size: 0.88rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s;
}
.btn-primary { background: var(--accent); color: white; }
.btn-primary:hover { background: var(--accent-hover); }
.btn-secondary { background: transparent; color: var(--text-sec); border: 1px solid var(--border); }
.btn-secondary:hover { background: var(--surface-alt); }

/* text-ref button to go back to passage */
.text-ref-btn {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 5px 12px;
  background: var(--accent-light);
  color: var(--accent-hover);
  border: 1px solid var(--accent);
  border-radius: 20px;
  font-size: 0.78rem;
  font-weight: 600;
  cursor: pointer;
  margin-bottom: 14px;
  transition: all 0.12s;
}
.text-ref-btn:hover { background: var(--accent); color: white; }

/* ---- RESULTS ---- */
.results-section {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 22px;
  margin-bottom: 18px;
  box-shadow: var(--shadow-sm);
}
.results-section h3 {
  font-family: 'Source Serif 4', serif;
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--accent-hover);
  margin-bottom: 14px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--border);
}
.score-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.score-cell {
  padding: 12px;
  background: var(--surface-alt);
  border-radius: var(--radius);
  text-align: center;
}
.score-cell .score-label {
  font-size: 0.72rem;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.3px;
  margin-bottom: 3px;
}
.score-cell .score-value { font-size: 1.4rem; font-weight: 700; color: var(--accent-hover); }
.score-cell .score-max { font-size: 0.78rem; color: var(--text-muted); }

.srl-profile-row {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 0;
  border-bottom: 1px solid var(--border-light);
}
.srl-profile-row:last-child { border-bottom: none; }
.srl-profile-label { width: 160px; font-size: 0.82rem; font-weight: 500; flex-shrink: 0; }
.srl-bar-container { flex: 1; height: 18px; background: var(--surface-alt); border-radius: 9px; overflow: hidden; }
.srl-bar-fill { height: 100%; border-radius: 9px; transition: width 0.5s ease; }
.srl-bar-fill.c1 { background: #1565C0; }
.srl-bar-fill.c2 { background: #E65100; }
.srl-bar-fill.c3 { background: var(--accent); }
.srl-bar-fill.c4 { background: #7B1FA2; }
.srl-bar-fill.c5 { background: #C62828; }
.srl-bar-fill.c6 { background: #00838F; }
.srl-bar-fill.c7 { background: #4527A0; }
.srl-profile-value { width: 46px; text-align: right; font-weight: 600; font-size: 0.82rem; }

/* ---- PRINT ---- */
@media print {
  .progress-bar, .nav-row, .text-ref-btn { display: none !important; }
  .section { display: block !important; page-break-inside: avoid; }
  body { background: white; }
}

/* ---- RESPONSIVE ---- */
@media (max-width: 600px) {
  .container { padding: 14px 12px 60px; }
  .header h1 { font-size: 1.3rem; }
  .passage-card { padding: 16px; }
  .score-grid { grid-template-columns: 1fr; }
  .srl-profile-label { width: 110px; font-size: 0.78rem; }
  .likert-option { font-size: 0.62rem; padding: 5px 1px; }
}
</style>
</head>
<body>

<div class="progress-bar">
  <div class="progress-inner">
    <div class="progress-track">
      <div class="progress-fill" id="progressFill" style="width: 0%"></div>
    </div>
    <span class="progress-label" id="progressLabel">Начало</span>
  </div>
</div>

<div class="container" id="app"></div>

<script>
// ============================================================
// DATA
// ============================================================

const PASSAGES = {
  set1: {
    label: 'Набор 1',
    title: 'Класификацията на организмите — ред в многообразието',
    meta: 'Непрекъснат текст · Изложение',
    html: `<p>На Земята съществуват милиони видове организми. За да могат учените да изучават и сравняват тази огромна разнообразност, те са създали система за класификация. Тя групира организмите по сходство и родствени връзки.</p>
<p>Основната единица в класификацията е видът. Организмите от един и същи вид могат да се размножават помежду си и да дават плодовито потомство. Сродните видове се обединяват в род, сродните родове — в семейство, семействата — в разред, разредите — в клас, класовете — в тип или отдел, а типовете — в царство. Тази йерархична система позволява на учените по целия свят да говорят за един и същи организъм, без да се объркват.</p>
<p>Съвременната наука разграничава пет царства организми: Монера, Протиста, Гъби, Растения и Животни. Царство Монера включва само прокариотни организми — бактерии, чиито клетки нямат оформено клетъчно ядро. Останалите четири царства се състоят от еукариотни организми — техните клетки имат ядро, оградено с мембрана.</p>
<p>Критерият за класификация не винаги е бил родствените връзки между организмите. В миналото учените са групирали организмите само по външен вид и начин на живот. Съвременната класификация обаче отчита преди всичко еволюционната близост — колко сродни са организмите в историческото си развитие. Именно затова делфините, въпреки че живеят във водата, са класифицирани при бозайниците, а не при рибите.</p>
<p class="source-note">По учебно съдържание по Биология и здравно образование за VII клас</p>`
  },
  set2: {
    label: 'Набор 2',
    title: 'Гъбичните инфекции — невидими, но реални',
    meta: 'Непрекъснат текст · Аргументация / Изложение',
    html: `<p>Всяка година милиони хора по света се заразяват с гъбички. Въпреки че гъбичните инфекции рядко застрашават живота, те причиняват значителен дискомфорт и, ако не се лекуват навреме, могат да се усложнят сериозно.</p>
<p>Гъбичките са организми от царство Гъби. За разлика от бактериите, те имат еукариотни клетки — с оформено клетъчно ядро. Хранят се чрез сапрофитно хранене: отделят храносмилателни вещества в средата и поглъщат разградените продукти. Именно тази особеност позволява на паразитните гъбички да разграждат и увреждат тъканите на гостоприемника.</p>
<p>Един от най-честите причинители е гъбичката <em>Candida albicans</em>. Тя обитава нормално кожата и лигавиците на здравия човек, но при отслабен имунитет, приемане на антибиотици или лоша хигиена се размножава неконтролирано. Признаците включват сърбеж, зачервяване и белезникав налеп. Засегнати могат да бъдат устната кухина, кожата и ноктите.</p>
<p>Друг разпространен причинител е гъбичката дерматофит, която причинява т.нар. „атлетско стъпало" — инфекция, разпространена сред хора, които ходят боси в обществени места като басейни и фитнес зали.</p>
<p>Превенцията на гъбичните инфекции е сравнително лесна: поддържане на добра лична хигиена, носене на подходящо обувало в обществени места, избягване на прекомерното приемане на антибиотици и укрепване на имунитета чрез здравословен начин на живот. При поява на признаци е важно да се потърси лекарска помощ навреме, а не да се самолекуваме.</p>
<p class="source-note">По учебно съдържание по Биология и здравно образование за VII клас</p>`
  },
  set3: {
    label: 'Набор 3',
    title: 'Гръбначните животни — стъпки в еволюцията',
    meta: 'Смесен текст · Описание + Сравнителна таблица',
    html: `<p>Гръбначните животни образуват подтип на царство Животни. Общата им характеристика е наличието на гръбначен стълб, който защитава гръбначния мозък и осигурява опора на тялото. Въпреки тази обща черта, петте основни класа гръбначни животни — риби, земноводни, влечуги, птици и бозайници — се различават значително по начин на дишане, размножаване и температура на тялото.</p>
<p>Рибите са най-древната група гръбначни. Те дишат с хриле и живеят изключително във вода. Земноводните (жаби, саламандри) са направили еволюционната крачка към сушата, но все още се размножават във вода и дишат едновременно с бели дробове и кожа. Влечугите (змии, гущери, костенурки) са се адаптирали напълно към сухоземния живот — дишат само с бели дробове и снасят яйца с твърда черупка на сушата.</p>
<p>Птиците и бозайниците са топлокръвни — поддържат постоянна телесна температура независимо от средата. Птиците дишат с бели дробове, снасят яйца и имат пера. Бозайниците раждат живи малки (с малки изключения) и ги кърмят с мляко. Именно тази черта — кърменето — е характерна само за бозайниците.</p>

function render() {
  const sec = SECTIONS[currentSection];
  const total = SECTIONS.length - 1;
  const pct = Math.round((currentSection / total) * 100);
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressLabel').textContent = sec.progress;

  const app = document.getElementById('app');
  let html = '';

  switch (sec.type) {
    case 'intro': html = rIntro(); break;
    case 'passage': html = rPassage(sec); break;
    case 'questions': html = rQuestions(sec); break;
    case 'srl': html = rSRL(); break;
    case 'demo': html = rDemo(); break;
    case 'results': html = rResults(); break;
  }

  app.innerHTML = html;
  window.scrollTo({ top: 0, behavior: 'smooth' });
  bindAll();
}

      <div class="block-icon reading">📖</div>
      <div><div class="block-title">Въпроси — ${p.label}</div><div class="block-sub">${p.meta}</div></div>
    </div>
    <button class="text-ref-btn" onclick="goTo(${passIdx})">↩ Виж текста отново</button>`;

  sec.questions.forEach(q => {
    html += `<div class="question-card">`;
    html += `<div class="q-number">${q.code} · ${q.level}</div>`;
    html += `<div class="q-text">${q.text}</div>`;

    if (q.type === 'mc') {
      html += `<div class="options-list">`;
      q.options.forEach((opt, i) => {
        const sel = R[q.id] === i ? 'selected' : '';
        html += `<label class="option-item ${sel}" data-qid="${q.id}" data-val="${i}">
          <input type="radio" name="${q.id}" value="${i}" ${R[q.id]===i?'checked':''}>
          <span>${opt}</span></label>`;
      });
      html += `</div>`;
    } else if (q.type === 'free') {
      html += `<textarea class="free-text" data-qid="${q.id}" placeholder="Напиши отговора си тук...">${R[q.id]||''}</textarea>`;
    } else if (q.type === 'ordering') {
      q.items.forEach((item, i) => {
        const val = R[q.id] ? R[q.id][i] : '';
        html += `<div class="ordering-item">
          <select data-qid="${q.id}" data-idx="${i}">
            <option value="">—</option>
            ${[1,2,3,4,5].map(n=>`<option value="${n}" ${val==n?'selected':''}>${n}</option>`).join('')}
          </select><span>${item}</span></div>`;
      });
    } else if (q.type === 'matching') {
      html += `<div style="font-size:0.8rem;color:var(--text-muted);margin-bottom:8px;">`;
      q.rightItems.forEach(r => { html += `${r}<br>`; });
      html += `</div>`;
      q.leftItems.forEach((item, i) => {
        const val = R[q.id] ? R[q.id][i] : '';
        html += `<div class="matching-row">
          <span class="match-label">${item}</span>
          <select data-qid="${q.id}" data-idx="${i}">
            <option value="">—</option>
            ${[1,2,3,4].map(n=>`<option value="${n}" ${val==n?'selected':''}>${n}</option>`).join('')}
          </select></div>`;
      });
    }
    html += `</div>`;
  });

  html += `<div class="nav-row">
    <button class="btn btn-secondary" onclick="goPrev()">← Назад</button>
    <button class="btn btn-primary" onclick="goNext()">Продължи →</button>
  </div>`;
  return html;
}

function rSRL() {
  let html = `
    <div class="block-header">
      <div class="block-icon srl">🧠</div>
      <div><div class="block-title">Как учиш?</div><div class="block-sub">Въпросник за саморегулация на ученето</div></div>
    </div>
    <div class="srl-intro">
      <strong>Няма верни или грешни отговори.</strong> За всяко твърдение избери колко често то се отнася за теб — от „Никога" до „Винаги". Прочети внимателно уводното изречение преди всяка група въпроси.
    </div>`;

  SRL_CONSTRUCTS.forEach(construct => {
    html += `<div class="srl-construct-label">${construct.name}</div>`;
    if (construct.stem) {
      html += `<div style="font-size:0.85rem;color:var(--text-sec);margin-bottom:12px;font-style:italic;padding-left:2px;">${construct.stem}</div>`;
    }
    construct.items.forEach(item => {
      html += `<div class="likert-card">
        <div class="likert-text">${item.text}</div>
        <div class="likert-scale">
          ${[
            {l:'Никога',v:1},{l:'Рядко',v:2},{l:'Понякога',v:3},{l:'Често',v:4},{l:'Винаги',v:5}
          ].map(o => {
            const sel = R[item.id] === o.v ? 'selected' : '';
            return `<div class="likert-option ${sel}" data-qid="${item.id}" data-val="${o.v}">${o.l}</div>`;
          }).join('')}
        </div>
      </div>`;
    });
  });

  html += `<div class="nav-row">
    <button class="btn btn-secondary" onclick="goPrev()">← Назад</button>
    <button class="btn btn-primary" onclick="goNext()">Продължи →</button>
  </div>`;
  return html;
}

function rDemo() {
  let html = `
    <div class="block-header">
      <div class="block-icon demo">📋</div>
      <div><div class="block-title">Няколко въпроса за теб</div><div class="block-sub">Тази информация помага за анализа — отговорите са анонимни.</div></div>
    </div>`;

  DEMO_QUESTIONS.forEach(dq => {
    html += `<div class="demo-card">
      <div class="demo-label">${dq.label}</div>
      <div class="demo-options">`;
    dq.options.forEach((opt, i) => {
      const sel = R[dq.id] === i ? 'selected' : '';
      html += `<label class="demo-option ${sel}" data-qid="${dq.id}" data-val="${i}">
        <input type="radio" name="${dq.id}" value="${i}" ${R[dq.id]===i?'checked':''}>
        <span>${opt}</span></label>`;
    });
    html += `</div></div>`;
  });

  html += `<div class="nav-row">
    <button class="btn btn-secondary" onclick="goPrev()">← Назад</button>
    <button class="btn btn-primary" onclick="goNext()">Виж резултатите →</button>
  </div>`;
  return html;
}

function rResults() {
  // Reading scores
  const scores = { total:0, max:0, n1:0, n1m:0, n2:0, n2m:0, n3:0, n3m:0 };
  let freeItems = [];

  SECTIONS.filter(s=>s.type==='questions').forEach(sec => {
    sec.questions.forEach(q => {
      const lk = q.level === 'Н1' ? 'n1' : q.level === 'Н2' ? 'n2' : 'n3';
      scores[lk+'m'] += q.points;
      scores.max += q.points;

      if (q.type === 'mc') {
        if (R[q.id] === q.correct) { scores[lk] += q.points; scores.total += q.points; }
      } else if (q.type === 'ordering') {
        if (R[q.id] && q.correct.every((v,i) => R[q.id][i]==v)) { scores[lk] += q.points; scores.total += q.points; }
      } else if (q.type === 'matching') {
        if (R[q.id]) {
          let m = 0;
          q.correct.forEach((v,i) => { if(R[q.id][i]==v) m++; });
          scores[lk] += m; scores.total += m;
        }
      } else if (q.type === 'free') {
        freeItems.push(q);
      }
    });
  });

  // SRL scores
  const srlData = SRL_CONSTRUCTS.map(c => {
    const vals = c.items.map(it => R[it.id]).filter(v => v);
    const avg = vals.length ? (vals.reduce((a,b)=>a+b,0)/vals.length) : 0;
    const pct = vals.length ? Math.round((vals.reduce((a,b)=>a+b,0)/(vals.length*5))*100) : 0;
    return { name: c.name, color: c.color, avg: avg.toFixed(1), pct, n: vals.length, total: c.items.length };
  });

  // Demo summary
  const demoSummary = DEMO_QUESTIONS.map(dq => {
    const val = R[dq.id] !== undefined ? dq.options[R[dq.id]] : '—';
    return { label: dq.label, value: val };
  });

  let html = `
    <div class="header">
      <h1>Диагностичен профил</h1>
      <p class="sub">Четивна грамотност · Саморегулация · Контекст</p>
    </div>

    <div class="results-section">
      <h3>📖 Четивна грамотност — автоматичен резултат</h3>
      <div class="score-grid">
        <div class="score-cell">
          <div class="score-label">Общо (авто)</div>
          <div class="score-value">${scores.total} <span class="score-max">/ ${scores.max}</span></div>
        </div>
        <div class="score-cell">
          <div class="score-label">Н1 — Намери</div>
          <div class="score-value">${scores.n1} <span class="score-max">/ ${scores.n1m}</span></div>
        </div>
        <div class="score-cell">
          <div class="score-label">Н2 — Тълкувай</div>
          <div class="score-value">${scores.n2} <span class="score-max">/ ${scores.n2m}</span></div>
        </div>
        <div class="score-cell">
          <div class="score-label">Н3 — Прецени</div>
          <div class="score-value">${scores.n3} <span class="score-max">/ ${scores.n3m}</span></div>
        </div>
      </div>
      <p style="font-size:0.78rem;color:var(--text-muted);margin-top:10px;">⚠ ${freeItems.length} свободни отговора изискват ръчно оценяване.</p>
    </div>

    <div class="results-section">
      <h3>🧠 Профил на саморегулация</h3>`;

  srlData.forEach(s => {
    html += `<div class="srl-profile-row">
      <span class="srl-profile-label">${s.name}</span>
      <div class="srl-bar-container"><div class="srl-bar-fill ${s.color}" style="width:${s.pct}%"></div></div>
      <span class="srl-profile-value">${s.avg}/5</span>
    </div>`;
  });

  html += `</div>

    <div class="results-section">
      <h3>📋 Контекстуални данни</h3>
      <table style="width:100%;border-collapse:collapse;font-size:0.84rem;">`;
  demoSummary.forEach(d => {
    html += `<tr><td style="padding:6px 8px;border-bottom:1px solid var(--border-light);color:var(--text-sec);width:45%;">${d.label}</td>
      <td style="padding:6px 8px;border-bottom:1px solid var(--border-light);font-weight:500;">${d.value}</td></tr>`;
  });
  html += `</table></div>

    <div class="results-section">
      <h3>✍ Свободни отговори (ръчно оценяване)</h3>`;
  freeItems.forEach(q => {
    const ans = R[q.id] || '(няма отговор)';
    html += `<div style="margin-bottom:14px;padding:10px 14px;background:var(--surface-alt);border-radius:var(--radius);">
      <div style="font-size:0.75rem;font-weight:600;color:var(--text-muted);margin-bottom:3px;">${q.code} · ${q.level} · макс. ${q.points} т.</div>
      <div style="font-size:0.84rem;font-weight:500;margin-bottom:5px;">${q.text}</div>
      <div style="font-size:0.88rem;padding:7px 10px;background:white;border-radius:4px;border:1px solid var(--border);white-space:pre-wrap;">${ans}</div>
    </div>`;
  });

  html += `</div>

    <div class="results-section">
      <h3>📊 Суров SRL запис</h3>
      <table style="width:100%;border-collapse:collapse;font-size:0.8rem;">
        <tr style="background:var(--surface-alt);">
          <th style="padding:5px 6px;text-align:left;border:1px solid var(--border);">Конструкт</th>
          <th style="padding:5px 6px;text-align:left;border:1px solid var(--border);">Айтем</th>
          <th style="padding:5px 6px;text-align:center;border:1px solid var(--border);width:50px;">1–5</th>
        </tr>`;
  SRL_CONSTRUCTS.forEach(c => {
    c.items.forEach(item => {
      html += `<tr>
        <td style="padding:4px 6px;border:1px solid var(--border);font-size:0.75rem;">${c.name}</td>
        <td style="padding:4px 6px;border:1px solid var(--border);">${item.text.substring(0,55)}...</td>
        <td style="padding:4px 6px;border:1px solid var(--border);text-align:center;font-weight:600;">${R[item.id]||'—'}</td>
      </tr>`;
    });
  });
  html += `</table></div>

    <div class="nav-row">
      <button class="btn btn-secondary" onclick="goPrev()">← Назад</button>
      <button class="btn btn-primary" onclick="window.print()">🖨 Принтирай</button>
    </div>`;

  return html;
}

// ============================================================
// EVENT BINDING
// ============================================================
function bindAll() {
  document.querySelectorAll('.option-item, .demo-option').forEach(el => {
    el.addEventListener('click', () => {
      const qid = el.dataset.qid;
      R[qid] = parseInt(el.dataset.val);
      document.querySelectorAll(`[data-qid="${qid}"]`).forEach(o => o.classList.remove('selected'));
      el.classList.add('selected');
      el.querySelector('input').checked = true;
    });
  });
  document.querySelectorAll('.likert-option').forEach(el => {
    el.addEventListener('click', () => {
      const qid = el.dataset.qid;
      R[qid] = parseInt(el.dataset.val);
      document.querySelectorAll(`.likert-option[data-qid="${qid}"]`).forEach(o => o.classList.remove('selected'));
      el.classList.add('selected');
    });
  });
  document.querySelectorAll('.free-text').forEach(el => {
    el.addEventListener('input', () => { R[el.dataset.qid] = el.value; });
  });
  document.querySelectorAll('.ordering-item select, .matching-row select').forEach(el => {
    el.addEventListener('change', () => {
      const qid = el.dataset.qid, idx = parseInt(el.dataset.idx);
      if (!R[qid]) R[qid] = [];
      R[qid][idx] = parseInt(el.value);
    });
  });
}

// ============================================================
// NAV
// ============================================================
function goNext() { if (currentSection < SECTIONS.length - 1) { currentSection++; render(); } }
function goPrev() { if (currentSection > 0) { currentSection--; render(); } }
function goTo(idx) { currentSection = idx; render(); }

render();
</script>
